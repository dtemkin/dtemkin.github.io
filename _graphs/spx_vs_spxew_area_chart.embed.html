    <p>
        The widening gap reflects how index construction feeds back into market behavior—capital follows the index, and the index increasingly follows capital.
        This comparison does not imply that equal weighting is superior. It illustrates how weighting rules can transform an index from a descriptive statistic into a participant in the system it measures.
        The fact that the S&P 500 Equal Weight Index seems to outperform the S&P 500 Captial Weighted Index (especially in recovery periods) shows how dependent the Weighted index is on a select group of stocks.
