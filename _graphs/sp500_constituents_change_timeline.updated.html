<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>S&P 500 Monthly Changes Timeline (1959-2025)</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
body{
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  margin:0;
  padding:16px;
  background:#ffffff;
  color:#111;
}

.controls{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:10px;
}

button, select{
  padding:6px 10px;
  border-radius:8px;
  border:1px solid #c7c7c7;
  background:#f8fafc;
}

.counter{
  margin-left:auto;
  display:flex;
  gap:12px;
}

.counter span{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid #ddd;
  background:#fff;
  font-weight:600;
}

.chart-wrap{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
}

.tooltip{
  background:#f3f4f6;
  border-radius:10px;
  padding:10px 12px;
  font-size:12px;
  box-shadow:0 10px 24px rgba(0,0,0,0.18);
}

.tooltip.added{ border:2px solid #16a34a; }
.tooltip.removed{ border:2px solid #dc2626; }
.tooltip.mixed{ border:2px solid #7c3aed; }

.tooltip ul{
  padding-left:16px;
  margin:6px 0 0;
}

.badge{
  font-weight:700;
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  margin-right:6px;
  border:1px solid #ccc;
}

.badge.added{ color:#16a34a; }
.badge.removed{ color:#dc2626; }

.year-label{
  font-size:18pt;
  font-weight:800;
  fill:#000;
}
</style>
</head>

<body>

<h2>S&P 500 Monthly Changes Timeline (1959-2025)</h2>

<div class="controls">
  <div class="counter">
    <span>🟢 Total Added: <span id="added">0</span></span>
    <span>🔴 Total Removed: <span id="removed">0</span></span>
  </div>
</div>

<div class="chart-wrap">
  <svg id="svg" width="100%" height="640"></svg>
</div>

<script>
/* IMPORTANT: data filename is fixed by requirement */
const DATA_URL = "sp500-change-events.json";

const parseDate = d3.utcParse("%Y-%m-%d");
const fmtMonthYear = d3.utcFormat("%b %Y");

const svg = d3.select("#svg");
const width = svg.node().getBoundingClientRect().width;
const height = 640;

const margin = {top:40,right:40,bottom:100,left:40};
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const g = svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`);
const baselineY = innerH * 0.72;

const xScale = d3.scaleUtc().range([0, innerW]);

function buildTooltip(events){
  const adds = events.filter(e=>e.action==="added").length;
  const rems = events.filter(e=>e.action==="removed").length;
  const cls = adds && rems ? "mixed" : adds ? "added" : "removed";

  const items = events.map(e=>{
    const badge = e.action==="added"
      ? '<span class="badge added">Added</span>'
      : '<span class="badge removed">Removed</span>';
    const date = fmtMonthYear(e.relevantDate);
    const name = e.company + (e.ticker ? ` (${e.ticker})` : "");
    return `<li>${badge}${name} — ${date}</li>`;
  }).join("");

  return `<div class="tooltip ${cls}"><ul>${items}</ul></div>`;
}

d3.json(DATA_URL).then(raw=>{
  const events = raw.map(d=>({
    action: (d.action||"").toLowerCase(),
    company: d.company||"",
    ticker: Array.isArray(d.tickers) ? d.tickers[0] : "",
    relevantDate: parseDate(d.action==="Removed" ? d.sp500_end : d.sp500_start)
  })).filter(d=>d.relevantDate);

  const months = d3.utcMonths(
    d3.min(events,d=>d.relevantDate),
    d3.utcMonth.offset(d3.max(events,d=>d.relevantDate),1)
  );

  xScale.domain(d3.extent(months));

  g.append("line")
    .attr("x1",0).attr("x2",innerW)
    .attr("y1",baselineY).attr("y2",baselineY)
    .attr("stroke","#c7c7c7");

  g.append("g")
    .attr("transform",`translate(0,${baselineY+24})`)
    .call(d3.axisBottom(xScale)
      .ticks(d3.utcMonth.every(1))
      .tickFormat(d3.utcFormat("%b"))
    );

  g.append("text")
    .attr("class","year-label")
    .attr("x",innerW/2)
    .attr("y",innerH+60)
    .attr("text-anchor","middle")
    .text(d3.utcFormat("%Y")(months[0]));

  const byMonth = d3.group(events, d=>+d3.utcMonth(d.relevantDate));
  let laneX = [];

  byMonth.forEach((evts, k)=>{
    const x = xScale(new Date(+k));
    let lane = 0;
    while(laneX[lane] && Math.abs(laneX[lane]-x) < 380) lane++;
    laneX[lane] = x;

    g.append("line")
      .attr("x1",x).attr("x2",x)
      .attr("y1",baselineY)
      .attr("y2",baselineY - 48 - lane*96)
      .attr("stroke","#9ca3af");

    g.append("foreignObject")
      .attr("x",x-180)
      .attr("y",baselineY - 88 - lane*96)
      .attr("width",360)
      .attr("height",88)
      .html(buildTooltip(evts));
  });
});
</script>

</body>
</html>
